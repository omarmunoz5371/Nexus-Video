name: Feature Request
description: Suggest a new feature or improvement for Nexus Video
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Please describe what you want and why it would be useful.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you are running into.
      placeholder: "There is no way to preview a pack without rebooting."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like Nexus Video to do differently.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any other approaches?

  - type: textarea
    id: hardware
    attributes:
      label: Hardware context
      description: Relevant hardware details (SBC, display, pixel format).
      placeholder: |
        - SBC: Raspberry Pi 4 2GB
        - Display: 800×480 DSI
        - bits_per_pixel: 16

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, sketches, video clips, or any other context.
