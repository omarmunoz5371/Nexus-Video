# Nexus Video — Moonraker Update Manager configuration
#
# Add this block to your moonraker.conf and restart Moonraker.
# After adding, Nexus Video will appear in the Update Manager panel
# in Mainsail or Fluidd alongside Nexus Screen.
#
# After an update, the service is restarted automatically.
# Your active pack (config.json) and custom packs (packs/custom/)
# are preserved across updates.

[update_manager nexus-video]
type: git_repo
path: ~/nexus-video
origin: https://github.com/TheOmProject/Nexus-Video.git
primary_branch: main
is_system_service: False
managed_services: nexus-video
